name: Run hw.yaml workflow

on:
  push:
    paths:
      - 'hw.yaml'
  pull_request:
    paths:
      - 'hw.yaml'
  workflow_dispatch:

jobs:
  check-hw-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show file content
        run: |
          echo "Contents of hw.yaml:"
          cat hw.yaml
          echo
          echo "Workflow executed successfully!"
